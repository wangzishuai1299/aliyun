services:
  db:
    image: mariadb:10.6
    container_name: mariadb-admin
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin@2026
      MYSQL_DATABASE: admin_db
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: Admin@2026
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi-backend:
    build: ./backend
    container_name: fastapi-admin
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/upload:/root/backend/upload
      - ./backend/excel:/root/backend/excel
      - ./backend/logs:/root/backend/logs
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # vue-front:
  #   build: ./admin-vue
  #   container_name: vue-front
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - fastapi-backend
  #   restart: always

volumes:
  db_data:
